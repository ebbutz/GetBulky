<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#1d3557">
<link rel="manifest" href="manifest.webmanifest">
<title>Gym Log</title>
<style>
:root{--warn:#b45309;--hd:#1d3557;--ink:#1d2433;--bg:#eef1f5;--card:#fff;--line:#d5dbe4;--acc:#2455d6;--ok:#1f8a4c;--mute:#6b7585}
@media (prefers-color-scheme:dark){#toast{color:#0b1f12}:root{--warn:#f0a35c;--hd:#27395a;--ink:#e8ecf3;--bg:#12161f;--card:#1c222e;--line:#313a4b;--acc:#7da2ff;--ok:#4cc17f;--mute:#93a0b5}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Helvetica,Arial,sans-serif}
#app{padding:14px 14px 90px;max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;padding:11px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.del{background:transparent;color:var(--mute);padding:6px 10px;border:0}
button.full{width:100%;margin-top:10px}
.row{display:flex;align-items:center;justify-content:space-between}
.row>*+*{margin-left:8px}
.two{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px}
.mute{color:var(--mute);font-size:14px}
.timer{font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0}
.timer.idle{color:var(--mute)}
.timer.run{color:var(--acc)}
.timer.done{color:var(--ok)}
.sets div{padding:6px 0;border-top:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;background:var(--hd);color:#fff;margin:-14px -14px 16px;padding:16px 14px}
.hd b{display:block;font-size:20px}
.hd span{font-size:13px;opacity:.8}
.hd button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.75);flex:none;margin-left:10px}
.seg{display:flex;margin:0 0 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;background:transparent;color:var(--mute);border-radius:0;padding:11px 0}
.seg button.on{background:var(--hd);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:16px 8px}
.stats.c2{grid-template-columns:1fr 1fr}
.st .sv{display:flex;align-items:center}
.st .sv svg{flex:none;width:20px;height:20px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--mute)}
.st .sv b{font-size:20px;white-space:nowrap}
.st .sl{font-size:13px;color:var(--mute);margin-top:2px}
.st.pos svg{color:var(--ok)}
.st.neg svg{color:var(--warn)}
.tile{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.tile .ico{flex:none;width:38px;height:38px;border-radius:9px;background:var(--bg);color:var(--acc);display:flex;align-items:center;justify-content:center;margin-right:12px}
.tile.done .ico{color:var(--ok)}
.tile.warn .ico{color:var(--warn)}
.tile .tb{flex:1;min-width:0}
.tile .tb b{display:block}
.tile>button{margin-left:8px;flex:none}
details>summary{cursor:pointer}
button:active{opacity:.8;transform:scale(.98)}
.bd{display:block;width:100%;max-width:300px;margin:6px auto 2px}
.bd .sil{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.bd .m{fill:var(--line);fill-opacity:.55}
.bd text{font-size:10px;fill:var(--mute);text-anchor:middle}
.mc{padding:6px 11px;margin:0 6px 6px 0;font-size:14px;font-weight:500;background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:999px}
.mc.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.mc.s{color:var(--acc);border-color:var(--acc);background:transparent}
.mlist{margin-top:8px}.mlist .row{padding:5px 0;border-top:1px solid var(--line);font-size:15px}
.mbar{display:inline-block;height:8px;border-radius:4px;background:var(--acc);margin-right:8px;vertical-align:middle}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin:0 4px 0 10px;vertical-align:middle}
.dot.s{opacity:.4}.dot:first-child{margin-left:0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(16px);transition:opacity .2s,transform .2s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes pop{0%{transform:scale(1.18)}100%{transform:scale(1)}}
.timer.pop{animation:pop .35s ease-out}
button:disabled{opacity:.45}
.card.dirty{border:2px solid var(--warn)}
.card.dirty textarea{border:2px solid var(--warn)}
.bkst{font-size:14px;margin:8px 0;color:var(--mute)}
.bkst.warn{color:var(--warn);font-weight:600}
.bkok{color:var(--ok);font-weight:600;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
#tabs button{flex:1;background:transparent;color:var(--mute);border-radius:0;padding:14px 4px}
#tabs button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.chk{display:inline-block;margin:4px 12px 4px 0;font-size:15px;color:var(--ink)}
.chk input{width:auto;margin-right:5px}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<div id="app"></div>
<div id="tabs"></div>
<div id="toast"></div>
<script>
(function () {
  var MUS = [['chest', 'Chest'], ['fdelt', 'Front shoulders'], ['sdelt', 'Side shoulders'], ['rdelt', 'Rear shoulders'], ['biceps', 'Biceps'], ['triceps', 'Triceps'],
    ['forearms', 'Forearms'], ['upback', 'Upper back'], ['lats', 'Lats'], ['lowback', 'Lower back'], ['abs', 'Abs'], ['obliques', 'Obliques'],
    ['glutes', 'Glutes'], ['quads', 'Quads'], ['hams', 'Hamstrings'], ['calves', 'Calves']];
  var MDEF = [
    [/goblet squat/i, ['quads', 'glutes'], ['hams', 'abs', 'lowback']],
    [/bench press/i, ['chest'], ['fdelt', 'triceps']],
    [/seated cable row|barbell row|cable row/i, ['lats', 'upback'], ['rdelt', 'biceps', 'forearms']],
    [/glute bridge|hip thrust/i, ['glutes'], ['hams', 'abs']],
    [/lateral raise/i, ['sdelt'], ['upback']],
    [/bird.?dog/i, ['lowback', 'glutes'], ['abs', 'rdelt', 'hams']],
    [/lunge/i, ['quads', 'glutes'], ['hams']],
    [/romanian|deadlift/i, ['hams', 'glutes'], ['lowback', 'upback', 'forearms']],
    [/pull.?up|chin.?up/i, ['lats'], ['biceps', 'upback', 'rdelt', 'forearms']],
    [/push.?up/i, ['chest'], ['fdelt', 'triceps', 'abs']],
    [/face pull/i, ['rdelt', 'upback'], ['sdelt']],
    [/calf raise/i, ['calves'], []],
    [/pallof/i, ['obliques', 'abs'], ['fdelt', 'glutes']],
    [/overhead press|shoulder press/i, ['fdelt', 'sdelt'], ['triceps', 'upback']],
    [/squat/i, ['quads', 'glutes'], ['hams', 'abs', 'lowback']],
    [/curl/i, ['biceps'], ['forearms']]
  ];
  var KEY = 'gymlog.v1', KEY_COPY = 'gymlog.lastcopy', tab = 'train', db = load(), timerId = null;
  var pg = { ex: 'all', metric: 'top', range: '5' };

  function seed() {
    return {
      ex: [{ id: 'e1', name: 'Bench press', rest: 120 }, { id: 'e2', name: 'Overhead press', rest: 90 },
        { id: 'e3', name: 'Squat', rest: 150 }, { id: 'e4', name: 'Barbell row', rest: 90 }, { id: 'e5', name: 'Bicep curl', rest: 60 }],
      tr: [{ id: 't1', name: 'Push', ex: ['e1', 'e2'], wt: 'wt1' }, { id: 't2', name: 'Legs', ex: ['e3'], wt: 'wt1' }, { id: 't3', name: 'Pull', ex: ['e4', 'e5'], wt: 'wt1' }],
      ses: [], oth: [],
      wt: [{ id: 'wt1', name: 'Build muscle' }, { id: 'wt2', name: 'CrossFit' }, { id: 'wt3', name: 'HIIT' }],
      wu: [{ id: 'wu1', name: 'Rowing' }, { id: 'wu2', name: 'Running' }, { id: 'wu3', name: 'Cycling' }]
    };
  }
  function load() { try { var s = localStorage.getItem(KEY); if (s) return fix(JSON.parse(s)); } catch (e) {} return seed(); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { alert('Could not save data.'); } }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function byId(a, id) { for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
  function fmtDate(t) { var d = new Date(t); return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function inputTime(t) { var d = new Date(t - new Date(t).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); }
  function mmss(s) { var neg = s < 0; s = Math.abs(Math.round(s)); var r = s % 60; return (neg ? '+' : '') + Math.floor(s / 60) + ':' + (r < 10 ? '0' : '') + r; }
  function activeSes() { for (var i = 0; i < db.ses.length; i++) if (!db.ses[i].end) return db.ses[i]; return null; }
  function activeRun(s) { if (!s) return null; for (var i = 0; i < s.runs.length; i++) if (!s.runs[i].end) return s.runs[i]; return null; }
  function endRun(s) { var r = activeRun(s); if (r) r.end = Date.now(); }
  function lastSets(eid, skipSes) { var r = lastRun(eid, skipSes); return r ? r.sets : null; }
  function lastRun(eid, skipSes) {
    for (var i = db.ses.length - 1; i >= 0; i--) {
      if (db.ses[i] === skipSes) continue;
      for (var j = db.ses[i].runs.length - 1; j >= 0; j--) if (db.ses[i].runs[j].eid === eid && db.ses[i].runs[j].sets.length) return db.ses[i].runs[j];
    }
    return null;
  }
  var owSel = '', wuSel = '', actLimit = 3, sumId = null, sumMode = 'trends', needTop = false, importMsg = '';

  function mKnown(id) { for (var i = 0; i < MUS.length; i++) if (MUS[i][0] === id) return true; return false; }
  function mName(id) { for (var i = 0; i < MUS.length; i++) if (MUS[i][0] === id) return MUS[i][1]; return id; }
  function mClean(a) { var o = [], i; if (!a || !a.length) return o; for (i = 0; i < a.length; i++) if (mKnown(a[i]) && o.indexOf(a[i]) < 0) o.push(a[i]); return o; }
  function mDefault(name) { for (var i = 0; i < MDEF.length; i++) if (MDEF[i][0].test(String(name))) return MDEF[i]; return null; }
  function musOf(eid, name) {
    var e = byId(db.ex, eid), d;
    if (e && (e.mp || e.ms)) return { p: mClean(e.mp), s: mClean(e.ms) };
    d = mDefault(name || (e && e.name));
    return d ? { p: d[1].slice(), s: d[2].slice() } : { p: [], s: [] };
  }
  /* body drawing: two views, shapes drawn once and mirrored */
  function bodySvg(val) {
    function st(id) { var v = val[id]; return v > 0 ? ' style="fill:var(--acc);fill-opacity:' + (0.22 + 0.78 * v).toFixed(2) + '"' : ''; }
    function el(id, tag, attrs, mirror) {
      var a = '<' + tag + ' class="m" ' + attrs + st(id) + '/>';
      return a + (mirror ? '<' + tag + ' class="m" transform="translate(120 0) scale(-1 1)" ' + attrs + st(id) + '/>' : '');
    }
    function e(id, cx, cy, rx, ry, mirror) { return el(id, 'ellipse', 'cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '"', mirror); }
    function sil() {
      return '<circle class="sil" cx="60" cy="18" r="12"/><rect class="sil" x="54" y="28" width="12" height="12"/>' +
        '<path class="sil" d="M36 44Q60 36 84 44L80 86Q78 120 76 128L44 128Q42 120 40 86Z"/>' +
        '<rect class="sil" x="19" y="48" width="14" height="44" rx="7"/><rect class="sil" x="87" y="48" width="14" height="44" rx="7"/>' +
        '<rect class="sil" x="14" y="94" width="12" height="46" rx="6"/><rect class="sil" x="94" y="94" width="12" height="46" rx="6"/>' +
        '<rect class="sil" x="38" y="124" width="21" height="72" rx="10"/><rect class="sil" x="61" y="124" width="21" height="72" rx="10"/>' +
        '<rect class="sil" x="41" y="196" width="16" height="50" rx="8"/><rect class="sil" x="63" y="196" width="16" height="50" rx="8"/>';
    }
    var f = e('chest', 47, 66, 12, 10, 1) + e('fdelt', 36, 55, 6, 8, 1) + e('sdelt', 26, 60, 5, 8, 1) + e('biceps', 26, 80, 6, 13, 1) + e('forearms', 20, 115, 5, 18, 1) +
      el('abs', 'rect', 'x="52" y="82" width="16" height="36" rx="5"') + e('obliques', 45, 102, 6, 15, 1) + e('quads', 48, 160, 10, 30, 1) + e('calves', 49, 218, 6, 21, 1) +
      el('upback', 'path', 'd="M48 38L72 38L82 47L38 47Z"');
    var b = el('upback', 'path', 'd="M60 38L80 48L72 74L60 84L48 74L40 48Z"') + e('rdelt', 34, 56, 8, 9, 1) + el('lats', 'path', 'd="M42 72L52 78L52 106L43 98Z"', 1) +
      e('triceps', 26, 80, 6, 13, 1) + e('forearms', 20, 115, 5, 18, 1) + el('lowback', 'rect', 'x="51" y="104" width="18" height="16" rx="5"') + e('glutes', 50, 136, 11, 11, 1) +
      e('hams', 48, 166, 10, 26, 1) + e('calves', 49, 216, 7, 19, 1);
    return '<svg class="bd" viewBox="0 0 250 262" role="img" aria-label="Muscle diagram, front and back"><g>' + sil() + f + '</g><g transform="translate(130 0)">' + sil() + b + '</g>' +
      '<text x="60" y="258">Front</text><text x="190" y="258">Back</text></svg>';
  }
  function exMusHtml(run) {
    var m = musOf(run.eid, run.name), v = {}, i, t = '';
    if (!m.p.length && !m.s.length) return '';
    for (i = 0; i < m.s.length; i++) v[m.s[i]] = 0.4;
    for (i = 0; i < m.p.length; i++) v[m.p[i]] = 1;
    t = '<div class="mute" style="text-align:center"><span class="dot" style="margin-left:0"></span>Primary: ' + esc(m.p.map(mName).join(', ') || '–') +
      (m.s.length ? '<br><span class="dot s" style="margin-left:0"></span>Secondary: ' + esc(m.s.map(mName).join(', ')) : '') + '</div>';
    return '<div class="card"><b>Muscles worked</b>' + bodySvg(v) + t + '</div>';
  }
  function sesMus(s) {
    var tot = {}, i, j, m, n, max = 0, k, out = [];
    for (i = 0; i < s.runs.length; i++) {
      n = s.runs[i].sets.length; if (!n) continue;
      m = musOf(s.runs[i].eid, s.runs[i].name);
      for (j = 0; j < m.p.length; j++) tot[m.p[j]] = (tot[m.p[j]] || 0) + n;
      for (j = 0; j < m.s.length; j++) tot[m.s[j]] = (tot[m.s[j]] || 0) + n * 0.5;
    }
    for (k in tot) if (tot.hasOwnProperty(k)) { out.push({ id: k, n: tot[k] }); if (tot[k] > max) max = tot[k]; }
    out.sort(function (a, b) { return b.n - a.n; });
    return { list: out, max: max };
  }
  function sesMusHtml(s) {
    var r = sesMus(s), v = {}, i, h = '';
    if (!r.list.length) return '';
    for (i = 0; i < r.list.length; i++) v[r.list[i].id] = r.list[i].n / r.max;
    h = '<h2>Muscles trained</h2><div class="card">' + bodySvg(v) + '<div class="mlist">';
    for (i = 0; i < r.list.length; i++)
      h += '<div class="row"><span>' + esc(mName(r.list[i].id)) + '</span><span><span class="mbar" style="width:' + Math.round(8 + 60 * r.list[i].n / r.max) + 'px"></span>' + (Math.round(r.list[i].n * 2) / 2) + '</span></div>';
    return h + '</div><div class="mute" style="margin-top:8px">Sets per muscle. Sets where the muscle is a helper count half. Darker = trained more.</div></div>';
  }
  var nxMp = [], nxMs = [], mOpen = '';
  function mChips(p, sec, attr) {
    var h = '', i, c;
    for (i = 0; i < MUS.length; i++) {
      c = p.indexOf(MUS[i][0]) >= 0 ? ' p' : sec.indexOf(MUS[i][0]) >= 0 ? ' s' : '';
      h += '<button class="mc' + c + '" data-a="' + attr[0] + '" ' + attr[1] + ' data-m="' + MUS[i][0] + '">' + MUS[i][1] + '</button>';
    }
    return h;
  }
  function mCycle(p, sec, m) {
    if (p.indexOf(m) >= 0) { p.splice(p.indexOf(m), 1); sec.push(m); }
    else if (sec.indexOf(m) >= 0) sec.splice(sec.indexOf(m), 1);
    else p.push(m);
  }
  function fix(d) {
    var i, j, f, bm = null;
    d.wu = d.wu || []; d.oth = d.oth || [];
    for (i = 0; i < (d.ex || []).length; i++) {
      f = d.ex[i];
      if (f.mp === undefined && f.ms === undefined) { j = mDefault(f.name); if (j) { f.mp = j[1].slice(); f.ms = j[2].slice(); } }
      else { f.mp = mClean(f.mp); f.ms = mClean(f.ms); }
    }
    for (i = 0; i < (d.ex || []).length; i++) if (d.ex[i].lower === undefined && /^(assisted pull|incline push)/i.test(String(d.ex[i].name))) d.ex[i].lower = true;
    if (!d.wt) d.wt = [{ id: 'wt1', name: 'Build muscle' }, { id: 'wt2', name: 'CrossFit' }, { id: 'wt3', name: 'HIIT' }];
    for (i = 0; i < d.wt.length; i++) if (String(d.wt[i].name).toLowerCase() === 'build muscle') bm = d.wt[i];
    for (i = 0; i < d.tr.length; i++) if (!d.tr[i].wt && bm) d.tr[i].wt = bm.id;
    for (i = 0; i < d.oth.length; i++) {
      if (d.oth[i].wt) continue;
      f = null;
      for (j = 0; j < d.wt.length; j++) if (String(d.wt[j].name).toLowerCase() === String(d.oth[i].name).toLowerCase()) f = d.wt[j];
      if (!f) { f = { id: uid(), name: d.oth[i].name }; d.wt.push(f); }
      d.oth[i].wt = f.id;
    }
    return d;
  }
  function trim(t) { return String(t).replace(/^\s+|\s+$/g, ''); }
  function wtName(id) { var w = byId(db.wt, id); return w ? w.name : ''; }
  function wtSelect(id) {
    var h = '<select id="' + id + '">', i;
    for (i = 0; i < db.wt.length; i++) h += '<option value="' + db.wt[i].id + '"' + (db.wt[i].name.toLowerCase() === 'build muscle' ? ' selected' : '') + '>' + esc(db.wt[i].name) + '</option>';
    return h + '</select>';
  }
  function typeSel(id, list, sel) {
    var h = '<select id="' + id + '"><option value="">Select\u2026</option>', i;
    for (i = 0; i < list.length; i++) h += '<option value="' + list[i].id + '"' + (list[i].id === sel ? ' selected' : '') + '>' + esc(list[i].name) + '</option>';
    return h + '<option value="__new">+ New type\u2026</option></select>';
  }
  function warmSec(x) { return x.sec != null ? x.sec : Math.round((x.min || 0) * 60); }
  function warmLine(x) { return x.name + (x.km ? ' ' + x.km + ' km' : '') + ' \u00b7 ' + mmss(warmSec(x)) + ' min'; }
  function warmText(w) { return w.map(warmLine).join(', '); }
  function warmHtml(s) {
    return '<h2>Warm-up</h2><div class="card"><label>Warm-up type</label>' + typeSel('wuType', db.wu, wuSel) +
      '<div class="two" style="grid-template-columns:1fr 1fr 1.4fr"><div><label>Min</label><input id="wuMin" type="number" inputmode="numeric" min="0"></div>' +
      '<div><label>Sec</label><input id="wuSec" type="number" inputmode="numeric" min="0" max="59"></div>' +
      '<div><label>Distance (km)</label><input id="wuKm" type="text" inputmode="decimal" autocomplete="off" placeholder="optional"></div></div>' +
      '<button class="full sec" data-a="addWarm">Add warm-up</button></div>';
  }
  function otherHtml() {
    var used = {}, avail = [], i;
    for (i = 0; i < db.tr.length; i++) if (db.tr[i].wt) used[db.tr[i].wt] = 1;

    moreAct: function () { actLimit = Math.min(10, actLimit + 3); },
    lessAct: function () { actLimit = 3; },
    addWuType: function () { var n = trim($('nwuName').value); if (!n) { alert('Enter a name.'); return false; } db.wu.push({ id: uid(), name: n }); },
    addWt: function () { var n = trim($('nwtName').value); if (!n) { alert('Enter a name.'); return false; } db.wt.push({ id: uid(), name: n }); },
    delWt: function (el) { if (!confirm('Delete this workout type? Past entries stay.')) return false; var id = el.getAttribute('data-id'); db.wt = db.wt.filter(function (x) { return x.id !== id; }); },
    delOther: function (el) { if (!confirm('Delete this workout?')) return false; var id = el.getAttribute('data-id'); db.oth = db.oth.filter(function (x) { return x.id !== id; }); },
    'import': function () {
      var raw = $('bk').value.replace(/^﻿/, ''), d;
      try { d = JSON.parse(raw); if (!d || !d.ex || !d.tr || !d.ses) throw 0; } catch (e) { alert('That text is not a valid backup. Copy the whole file, from the first { to the last }.'); return false; }
      if (!confirm('Replace all data in the app with this backup?\n\n' + d.ses.length + ' trainings, ' + d.ex.length + ' exercises.')) return false;
      db = fix(d);
      importMsg = 'Imported ' + db.ses.length + ' trainings, ' + db.ex.length + ' exercises and ' + db.oth.length + ' other workouts.';
    },
    discard: function () { importMsg = ''; return true; }
  };
  document.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== document && !el.getAttribute('data-a') && !el.getAttribute('data-tab')) el = el.parentNode;
    if (!el || el === document) return;
    if (el.getAttribute('data-tab')) { tab = el.getAttribute('data-tab'); importMsg = ''; render(); return; }
    if (A[el.getAttribute('data-a')](el) !== false) { save(); render(); }
  });
  document.addEventListener('input', function (e) { if (e.target && e.target.id === 'bk') bkSync(); });
  document.addEventListener('change', function (e) { if (e.target && e.target.id === 'bk') bkSync(); });
  document.addEventListener('change', function (e) {
    var t = e.target, id = t.getAttribute && t.getAttribute('data-rest'), sd = t.getAttribute && t.getAttribute('data-sides'), lw = t.getAttribute && t.getAttribute('data-lower');
    if ((t.id === 'owType' || t.id === 'wuType') && t.value === '__new') {
      var nm = trim(prompt('Name of the new type') || '');
      if (nm) {
        var nid = uid();
        if (t.id === 'owType') { db.wt.push({ id: nid, name: nm }); owSel = nid; } else { db.wu.push({ id: nid, name: nm }); wuSel = nid; }
        save();
      }
      render(); return;
    }
    if (sd) { var ex2 = byId(db.ex, sd); if (ex2) { ex2.sides = t.checked; save(); } return; }
    if (lw) { var ex4 = byId(db.ex, lw); if (ex4) { ex4.lower = t.checked; save(); } return; }
    var rd = t.getAttribute && t.getAttribute('data-rounds'), rp = t.getAttribute && t.getAttribute('data-reps');
    if (rd || rp) { var ex3 = byId(db.ex, rd || rp); if (ex3) { ex3[rd ? 'rounds' : 'reps'] = t.value.replace(/^\s+|\s+$/g, ''); save(); } return; }
    if (id) { var ex = byId(db.ex, id), v = parseInt(t.value, 10); if (ex && !isNaN(v)) { ex.rest = v; save(); } return; }
    if (t.id === 'pgEx') pg.ex = t.value; else if (t.id === 'pgRange') pg.range = t.value; else if (t.id === 'pgMetric') pg.metric = t.value; else return;
    render();
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  render();
})();
</script>
</body>
</html>
